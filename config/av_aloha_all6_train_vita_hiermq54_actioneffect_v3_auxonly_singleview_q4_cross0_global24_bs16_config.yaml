project:
  name: "VLANeXt_vita_hiermq54_actioneffect_v3_auxonly_singleview_q4_cross0_global24_nodct_bs16_av_aloha_all6"
  output_dir: "/home/dm/QWENLA/VLANeXt_migration/VLANeXt/checkpoints"
  log_interval: 10
  save_interval: 32000
  use_wandb: true

data:
  dataset_name: "av_aloha"
  data_root: "/media/dm/Elements/VLANeXt_migration/data/AV_ALOHA/converted/iantc104"
  av_aloha_tasks:
    - "av_aloha_sim_cube_transfer"
    - "av_aloha_sim_thread_needle"
    - "av_aloha_sim_peg_insertion"
    - "av_aloha_sim_pour_test_tube"
    - "av_aloha_sim_hook_package"
    - "av_aloha_sim_slot_insertion"
  main_camera: "observation.images.zed_cam_left"
  action_normalization: "min_max"
  state_normalization: "identity"
  balance_tasks: true
  fps: 25
  full_sequence: true
  history_len: 8
  future_len: 8
  buffer_size: 256
  batch_size: 16
  max_steps: 160000
  num_workers: 1
  input_modality: "image"
  view_mode: "single"
  augmentation:
    enabled: true
    random_resized_crop: {scale: [0.8, 1.0], ratio: [0.9, 1.1]}
    random_brightness: [0.2]
    random_contrast: [0.8, 1.2]
    random_saturation: [0.8, 1.2]
    random_hue: [0.05]
    augment_order: ["random_resized_crop", "random_brightness", "random_contrast", "random_saturation", "random_hue"]

model:
  model_type: "vlanext"
  lmm_path: "/home/dm/QWENLA/VLANeXt_migration/VLANeXt/pretrained/Qwen3.5-0.8B"
  vision_encoder_path: "google/siglip2-base-patch16-256"
  backbone_mode: "finetune"
  attn_implementation: "sdpa"
  vlm_truncate_layers: 12
  action_dim: 21
  loss_type: "diffusion"
  scheduler_type: "flow_match"
  action_generation_mode: "vita_latent_flow"
  num_train_timesteps: 1000
  num_inference_timesteps: 6

  vita_condition_source: "hidden_layer"
  vita_hidden_layer_index: 12
  vita_hidden_pooling: "attention"
  vita_pooling_num_heads: 8
  vita_pooling_num_queries: 52
  vita_gated_weighted_pooling: true
  vita_hierarchical_query_pooling: true
  vita_layer_local_queries_per_layer: 2
  vita_layer_local_queries_per_layer_list: [8, 4, 4, 4, 4, 4]
  vita_layer_local_token_source_modes: ["visual", "text", "all", "all", "all", "all"]
  vita_cross_layer_queries: 0
  vita_global_queries: 24
  vita_blockwise_layer_conditioning: false
  vita_blockwise_hidden_layer_indices: [0, 0, 1, 4, 8, 12]
  vita_state_token_conditioning: true
  vita_state_num_tokens: 2
  vita_state_token_dropout: 0.1

  vita_action_effect_enabled: true
  vita_action_effect_condition_action_encoder: false
  vita_action_effect_main_view_only: true
  vita_action_effect_visual_queries: 4
  vita_action_effect_num_heads: 8
  vita_action_effect_encoder_layers: 2
  vita_action_effect_decoder_layers: 2
  vita_action_effect_visual_ae_weight: 0.01
  vita_action_effect_visual_flow_weight: 0.0

  vita_flow_layer_logits_init: null
  vita_flow_cross_attention: true
  vita_flow_cross_attention_heads: 8
  vita_gated_flow_cross_attention: true
  vita_flow_cross_attention_fixed_scale: 0.1
  vita_mq_token_value_gating: true
  vita_mq_token_gate_lambda: 0.8
  vita_mq_token_gate_use_action_latent: true
  vita_latent_dim: 1024
  vita_hidden_dim: 1024
  vita_action_ae_layers: 6
  vita_flow_layers: 8
  vita_flow_mlp_ratio: 4.0
  vita_dropout: 0.0
  vita_num_sampling_steps: 6
  vita_enc_recon_weight: 0.2
  vita_flow_recon_weight: 0.2
  vita_consistency_weight: 1.0
  vita_diversity_loss_weight: 0.0
  vita_log_diversity_loss: true
  vita_recon_loss_type: "l1"
  vita_use_proprio: true

  condition_type: "soft"
  num_queries: 64
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4
  policy_hidden_size: 1024
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0
  num_bins: 256
  action_vqvae: {enabled: false, frozen: true}
  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 29
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"
  dct_loss_weight: 0.0
  dct_freq_split: 0.125
  dct_low_freq_weight: 5.0
  dct_high_freq_weight: 0.0
  dct_similarity_type: "mse"
  use_progress_head: false
  use_progress_film: false
  progress_loss_weight: 0.0
  use_vlm_layer_attention: false
  use_latent_bridge: false
  use_proprio_input_vlm: false
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: false

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-4
  vlm_lr_multiplier: 0.1
  weight_decay: 0.01
  warmup_steps: 8000
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
